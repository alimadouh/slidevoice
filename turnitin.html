  <section class="tn-pane tn-submitcard">
    <p class="tn-credits" id="tnCredits" hidden></p>
    <button class="btn btn-green" id="tnBuy" hidden>Buy a scan — 3 KWD</button>
    <label class="tn-drop" id="tnDrop" for="tnFile">
      <span class="tn-drop-ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></svg>
      </span>
      <span class="tn-drop-txt"><b id="tnFileLbl">Drop your document here</b></span>
    </label>
    <input type="file" id="tnFile" accept=".doc,.docx,.ppt,.pptx,.pdf" hidden>
    <textarea id="tnNote" rows="2" maxlength="500" placeholder="Note for the team (optional)"></textarea>
    <div class="tn-submitrow">
      <button class="btn btn-primary tn-submitbtn" id="tnSubmit">Submit for Turnitin check</button>
    </div>
    <p class="tn-msg hidden" id="tnMsg"></p>
  </section>

  <section class="tn-list">
    <h2 class="tn-listtitle">My scans</h2>
    <div id="tnOrders"><p class="tn-empty">Loading…</p></div>
  </section>
</main>

<div class="tn-chat-ovl hidden" id="tnChatOvl">
  <div class="tn-chat" role="dialog" aria-modal="true">
    <div class="tn-chat-head"><span id="tnChatTitle">Chat</span><button id="tnChatClose" aria-label="Close">✕</button></div>
    <div class="tn-chat-body" id="tnChatBody"></div>
    <div class="tn-chat-foot">
      <input id="tnChatInp" maxlength="2000" placeholder="Write a message…">
      <button class="btn btn-primary" id="tnChatSend">Send</button>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
