<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>B7oothKw — Codes</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="assets/icon.png" />
<script src="js/guard.js"></script>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/humanizer.css" />
<link rel="stylesheet" href="css/shell.css" />
<link rel="stylesheet" href="css/sections.css" />
<link rel="stylesheet" href="css/codes.css" />
</head>
<body class="hz-page" data-view="codes">
<script src="js/theme.js"></script>
<div class="app-shell" id="appShell">
  <main class="content">
    <section class="view" id="view-codes">
      <h1 class="sr-only">B7oothKw Codes</h1>
      <h2 class="view-title"><span class="nav-ic" style="color:var(--acc)">🎟</span> Codes</h2>

      <!-- The whole form: one button. The code it makes appears underneath. -->
      <div class="cd-mint">
        <button class="btn btn-primary code-gen" id="codeGenBtn" type="button">Generate code</button>
        <div class="code-out hidden" id="codeOut"></div>
      </div>

      <div class="code-bar">
        <div class="cd-tabs" id="codeTabs">
          <button class="cd-tab on" type="button" data-st="all">All <span class="cd-n" data-n="all">0</span></button>
          <button class="cd-tab" type="button" data-st="active">Unused <span class="cd-n" data-n="active">0</span></button>
          <button class="cd-tab" type="button" data-st="used up">Redeemed <span class="cd-n" data-n="used up">0</span></button>
          <button class="cd-tab" type="button" data-st="expired">Expired <span class="cd-n" data-n="expired">0</span></button>
          <button class="cd-tab" type="button" data-st="revoked">Revoked <span class="cd-n" data-n="revoked">0</span></button>
        </div>
        <input id="codeSearch" class="cd-search" type="search" autocomplete="off" spellcheck="false"
               placeholder="Search code or email" aria-label="Search codes">
        <button class="code-refresh" id="codeRefreshBtn" type="button" title="Refresh">Refresh</button>
      </div>

      <div id="codeBody"><p class="code-empty">Loading&hellip;</p></div>
      <p class="cd-msg" id="cdMsg"></p>
    </section>
  </main>
</div>

<script src="js/auth.js"></script>
<script src="js/config.js"></script>
<script src="js/shell.js"></script>
<script src="js/codes.js"></script>
</body>
</html>
